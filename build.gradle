plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version '2.4.10'
	id 'maven-publish'
}

repositories {
	// Fabric Language Kotlin is published on the Fabric maven, which Loom
	// already adds automatically -- nothing extra needed here.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aero" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ ships unobfuscated, so there are no mappings to apply --
	// Loom uses Mojang's own names straight out of the jar.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fabric Language Kotlin -- lets our entrypoints/classes be written in
	// Kotlin and provides the Kotlin stdlib/coroutines/serialization at runtime.
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

// Loom's own default sponge-mixin (0.15.4) is missing IAdviceProvider,
// which fabric-loader 0.19.x's mixin service needs -> crash on launch.
// 0.17.1+ has it, but breaks fabric-api's own fluid-rendering mixin
// (MixinExtras 0.4.1's EXPRESSION injection point isn't valid against
// that sponge-mixin version). Bump MixinExtras alongside it -- the two
// are meant to move together -- to fix that regression too.
configurations.configureEach {
	resolutionStrategy {
		force "net.fabricmc:sponge-mixin:0.17.1+mixin.0.8.7"
		force "io.github.llamalad7:mixinextras-fabric:0.5.4"
	}
}


processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Deploy the built mod jar straight into the "26.2" Prism Launcher
// instance's mods folder, so `./gradlew build` (or an IDE build) is enough
// to pick the new jar up next time that instance is launched.
def prismModsDir = file("/home/zephyn/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/26.2/minecraft/mods")

tasks.register("deployToPrism", Copy) {
	group = "aero"
	description = "Copies the built mod jar into the Prism Launcher 26.2 instance's mods folder."

	dependsOn jar
	from(jar.archiveFile)
	into(prismModsDir)

	doFirst {
		// Remove older Aero jars first so renames/version bumps don't leave
		// stale duplicates loaded alongside the new one.
		if (prismModsDir.exists()) {
			prismModsDir.listFiles({ f -> f.name.startsWith("aero-") && f.name.endsWith(".jar") } as FileFilter)
				?.each { it.delete() }
		}
	}
}

build.finalizedBy(deployToPrism)

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
