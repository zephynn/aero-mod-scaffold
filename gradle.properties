# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.java.home=/home/zephyn/jdks/jdk-25.0.1+8

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Targets Minecraft 1.21.11. Turns out this environment's "ships
# unobfuscated" era started at or before 1.21.11, not at 26.1 like the
# comment this replaced assumed -- Fabric publishes a separate
# "1.21.11_unobfuscated" game version and matching Fabric API builds
# (tagged "+1.21.11_unobfuscated") for it, distinct from the normal
# obfuscated "1.21.11". officialMojangMappings() is a no-op here, same as
# it was on 26.2 -- nothing is actually remapped.
minecraft_version=1.21.11_unobfuscated
loader_version=0.19.3

# Mod Properties
version=0.1.0
group=dev.finn.aero

# Dependencies
fabric_api_version=0.139.4+1.21.11_unobfuscated
loom_version=1.17.19

# Fabric Language Kotlin - bundles the Kotlin stdlib/reflect so the mod
# doesn't need to ship its own copy of Kotlin.
fabric_kotlin_version=1.13.13+kotlin.2.4.10
