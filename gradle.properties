# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.java.home=/home/zephyn/jdks/jdk-25.0.1+8

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Targets Minecraft 26.2 to match the "26.2" Prism Launcher instance this mod
# gets deployed into. 26.1 onward ships unobfuscated, so there are no Yarn
# mappings any more -- the build uses Mojang's official names directly
# (loom.officialMojangMappings()) and nothing is remapped.
minecraft_version=26.2
loader_version=0.19.3

# Mod Properties
version=0.1.0
group=dev.finn.aero

# Dependencies
fabric_api_version=0.158.0+26.2
loom_version=1.17.19

# Fabric Language Kotlin - bundles the Kotlin stdlib/reflect so the mod
# doesn't need to ship its own copy of Kotlin.
fabric_kotlin_version=1.13.13+kotlin.2.4.10
