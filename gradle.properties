# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.java.home=/home/zephyn/jdks/jdk-21.0.12.1+1

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# We target Minecraft 1.21.1 because as of mid-2025 it is the most recent
# Minecraft version with a fully stable, mature release of Fabric Loader,
# Fabric API, AND Fabric Language Kotlin all available together -- newer
# snapshots/versions frequently lag behind on one of those three.
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.3

# Mod Properties
version=0.1.0
group=dev.finn.aero

# Dependencies
fabric_api_version=0.116.15+1.21.1
loom_version=1.17.19

# Fabric Language Kotlin - bundles the Kotlin stdlib/reflect so the mod
# doesn't need to ship its own copy of Kotlin.
fabric_kotlin_version=1.12.3+kotlin.2.0.21
